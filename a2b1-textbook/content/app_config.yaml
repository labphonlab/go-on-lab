# アプリ連携の共通設定。QR/ディープリンク生成（scripts/build_pdf.py）が参照する。
#
# deep_link_base: セクション単位のディープリンクのベースURL。
#   実際のリンクは f"{deep_link_base}/u/{unit}/{section_id}" になる（CLAUDE.md §4, §7）。
# short_domain: 紙面に QR と併記する短縮URLのドメイン。
#   短縮コードは build_pdf.py が "u{unit}s{n}" 形式で自動採番する
#   （n はそのユニット内でQRを持つセクションの出現順、1始まり）。
#   TODO(Phase 2): short_domain 側（goon.jp）のリダイレクト実装は
#   build/qr-map.json（short_code -> deep_link）を入力に構築する。

deep_link_base: "https://learn.goonresearch.jp"
short_domain: "goon.jp"
