# 書誌情報。scripts/build_pdf.py の --full-book と scripts/build_epub.py が
# 表紙まわり（扉・奥付）の生成に使う単一ソース。
#
# NOTE: title / subtitle / isbn は仮の初期値。KDP 登録前に発行者が最終確認・
# 変更すること（docs/kdp-metadata.md にチェックリストあり）。

title: "独習英語トレーニング A2→B1"
subtitle: "聞く・読む・話す・書くを鍛える全20ユニット［紙＋アプリ対応］"
author: "語音研究所 語学教材編集部"
publisher: "語音研究所（Go-on Research Institute）"
publisher_url: "https://goonresearch.jp"
app_url: "https://learn.goonresearch.jp"
copyright_year: 2026

# ペーパーバック用。KDP の無料ISBNを使う場合は "KDPが自動割当" のままでよい。
# 独自ISBNを購入した場合はここを更新する。
isbn_paperback: "KDPが自動割当（未確定）"

# 電子版（Kindle）はASINが自動採番されるためISBN不要。
isbn_ebook: null

contact_email: "TODO: 発行者の問い合わせ用メールアドレスをここに設定"

# KDP ペーパーバックのトリムサイズ。ワークブック系で標準的な 7x10in を採用。
# 最終ページ数が確定したら、KDP の公式マージン計算ツールで inside(のど)側の
# 余白値を必ず再確認すること（ページ数に応じて必要な のど 幅が変わるため）。
trim_size:
  width_in: 7
  height_in: 10
  margin_top_in: 0.75
  margin_bottom_in: 0.75
  margin_outside_in: 0.5
  margin_inside_in: 0.875  # のど。ページ数確定後に要再確認（docs/kdp-metadata.md参照）
