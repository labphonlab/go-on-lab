  - unit: 18
    title: "Telling a Story"
    cefr_j: "B1.1"
    topic: "経験談を時系列でまとまりよく語る"
    grammar_focus: ["narrative tenses review", "reported speech (light introduction)"]
    vocabulary_target_count: 50
    consolidation: false
    status: planned

  - unit: 19
    title: "Travel and Problems"
    cefr_j: "B1.1"
    topic: "旅行中のトラブルに対処する"
    grammar_focus: ["second conditional (light introduction)", "past modals: should have"]
    vocabulary_target_count: 50
    consolidation: false
    status: planned

  - unit: 20
    title: "Looking Back, Looking Forward"
    cefr_j: "B1.1"
    topic: "学習を振り返り、次の目標を立てる（自己調整学習）"
    grammar_focus: ["review of units 16–19", "goal-setting language"]
    vocabulary_target_count: 0
    consolidation: true
    status: planned
