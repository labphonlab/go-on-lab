# 全体シラバス — A2→B1 総合英語テキスト（20ユニット）
#
# cefr_j: CEFR-J Can-do レベル（A2.2 → B1.1 の範囲で配列）
# consolidation: true のユニットは新規文法・新規ターゲット語彙を導入せず、
#   既習素材の流暢性開発（4/3/2、timed reading、既習語 SRS 総復習）に充当する。
# vocabulary_target_count: そのユニットで新規導入するターゲット語数の目安
#   （5ユニットごとの consolidation ユニットは 0）。全ユニット合計で約900語。
# status: unit.yaml / sections が実装済みかどうか（Phase 1 は unit01 のみ）

meta:
  total_units: 20
  target_vocabulary_total: 900
  vocabulary_source: "NGSL 1,001–2,800 rank band"
  cefr_progression: "A2.2 → B1.1 (CEFR-J)"
  consolidation_every: 5

units:
  - unit: 1
    title: "Making Plans with Friends"
    cefr_j: "A2.2"
    topic: "友人と週末の予定を立てる"
    grammar_focus: ["be going to vs will", "shall we / why don't we"]
    vocabulary_target_count: 45
    consolidation: false
    status: implemented

  - unit: 2
    title: "Talking About Your Week"
    cefr_j: "A2.2"
    topic: "先週したことを時系列で話す"
    grammar_focus: ["simple past (regular/irregular review)", "sequencing words: first, then, after that"]
    vocabulary_target_count: 45
    consolidation: false
    status: implemented

  - unit: 3
    title: "Have You Ever...?"
    cefr_j: "A2.2"
    topic: "経験について尋ねる・答える"
    grammar_focus: ["present perfect: experience (have/has + past participle)", "ever / never"]
    vocabulary_target_count: 45
    consolidation: false
    status: implemented

  - unit: 4
    title: "Comparing Things"
    cefr_j: "A2.2"
    topic: "物・場所・人を比較して説明する"
    grammar_focus: ["comparatives", "superlatives", "as...as"]
    vocabulary_target_count: 45
    consolidation: false
    status: implemented

  - unit: 5
    title: "Consolidation 1"
    cefr_j: "A2.2"
    topic: "Units 1–4 の総復習（流暢性開発）"
    grammar_focus: []
    vocabulary_target_count: 0
    consolidation: true
    status: implemented

  - unit: 6
    title: "Asking for Directions"
    cefr_j: "A2.2"
    topic: "道を尋ねる・案内する"
    grammar_focus: ["imperatives", "prepositions of place", "could you / would you"]
    vocabulary_target_count: 45
    consolidation: false
    status: implemented

  - unit: 7
    title: "Ordering Food and Making Requests"
    cefr_j: "A2.2"
    topic: "レストラン・カフェでの注文と丁寧な依頼"
    grammar_focus: ["would like", "could I have...?", "polite request patterns"]
    vocabulary_target_count: 50
    consolidation: false
    status: implemented

  - unit: 8
    title: "Describing People and Things"
    cefr_j: "B1.1"
    topic: "関係節を使って人やものを詳しく説明する"
    grammar_focus: ["relative clauses: who / which / that"]
    vocabulary_target_count: 50
    consolidation: false
    status: implemented

  - unit: 9
    title: "What's Wrong? Health and Advice"
    cefr_j: "A2.2"
    topic: "体調を伝え、アドバイスをする・受ける"
    grammar_focus: ["should / shouldn't", "have to / don't have to"]
    vocabulary_target_count: 45
    consolidation: false
    status: implemented

  - unit: 10
    title: "Consolidation 2"
    cefr_j: "A2.2/B1.1"
    topic: "Units 6–9 の総復習（流暢性開発）"
    grammar_focus: []
    vocabulary_target_count: 0
    consolidation: true
    status: implemented

  - unit: 11
    title: "Talking About the Past in Detail"
    cefr_j: "B1.1"
    topic: "過去の出来事を背景と共に詳しく語る"
    grammar_focus: ["past continuous vs past simple", "while / when"]
    vocabulary_target_count: 50
    consolidation: false
    status: planned

  - unit: 12
    title: "If I Have Time..."
    cefr_j: "B1.1"
    topic: "条件と結果について話す"
    grammar_focus: ["first conditional (if + present, will)"]
    vocabulary_target_count: 45
    consolidation: false
    status: planned

  - unit: 13
    title: "Asking Indirectly"
    cefr_j: "B1.1"
    topic: "丁寧に間接的に質問・依頼をする"
    grammar_focus: ["indirect questions: Could you tell me...?", "Do you know...?"]
    vocabulary_target_count: 45
    consolidation: false
    status: planned

  - unit: 14
    title: "Passive Voice in Everyday Life"
    cefr_j: "B1.1"
    topic: "ニュース・説明文で受動態を理解し使う"
    grammar_focus: ["passive voice: present simple / past simple"]
    vocabulary_target_count: 50
    consolidation: false
    status: planned

  - unit: 15
    title: "Consolidation 3"
    cefr_j: "B1.1"
    topic: "Units 11–14 の総復習（流暢性開発）"
    grammar_focus: []
    vocabulary_target_count: 0
    consolidation: true
    status: planned

  - unit: 16
    title: "Hopes and Plans"
    cefr_j: "B1.1"
    topic: "将来の希望・目標について話す"
    grammar_focus: ["infinitive vs gerund: want to / enjoy -ing / decide to / avoid -ing"]
    vocabulary_target_count: 45
    consolidation: false
    status: planned

  - unit: 17
    title: "Giving Opinions and Agreeing/Disagreeing"
    cefr_j: "B1.1"
    topic: "意見を述べ、賛成・反対を伝える"
    grammar_focus: ["I think / I don't think", "So do I / Neither do I"]
    vocabulary_target_count: 45
    consolidation: false
