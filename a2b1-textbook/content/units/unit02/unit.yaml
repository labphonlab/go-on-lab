unit: 2
title: "Talking About Your Week"
cefr_j: "A2.2"

can_do:
  - id: "A2.2-SP-1"
    ja: "先週の出来事を、first・then・finally などの語を使って時系列で話すことができる"
  - id: "A2.2-WR-1"
    ja: "先週したことについて、時を表す語を使って短い段落を書くことができる"

