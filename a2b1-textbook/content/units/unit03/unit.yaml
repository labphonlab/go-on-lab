unit: 3
title: "Have You Ever...?"
cefr_j: "A2.2"

can_do:
  - id: "A2.2-SI-5"
    ja: "「〜したことがありますか」と経験をたずね、have/has + 過去分詞で簡単に答えることができる"
  - id: "A2.2-SI-6"
    ja: "ever / never を使って、自分の経験の有無や回数を簡単に説明できる"

grammar_focus:
