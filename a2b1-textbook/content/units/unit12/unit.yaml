unit: 12
title: "If I Have Time..."
cefr_j: "B1.1"

can_do:
  - id: "B1.1-SI-5"
    ja: "「もし〜なら、〜するだろう」のように、起こりそうな条件とその結果について話すことができる"
  - id: "B1.1-SI-6"
    ja: "相手が言う条件と結果の文（if を使った簡単な文）を聞いて、内容を理解できる"

