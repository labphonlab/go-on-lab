unit: 16
title: "Hopes and Plans"
cefr_j: "B1.1"

can_do:
  - id: "B1.1-SI-11"
    ja: "want to / hope to / plan to / decide to や enjoy -ing / avoid -ing など、動詞ごとの正しい形（不定詞か動名詞か）を使って、自分の将来の希望や目標を伝えることができる"
  - id: "B1.1-SI-12"
    ja: "相手に将来の希望・目標について質問し、答えの内容（何を望んでいるか、何を避けたいか）を理解することができる"

grammar_focus:
  - "不定詞をとる動詞: want to / hope to / plan to / decide to"
  - "動名詞（-ing）をとる動詞: enjoy -ing / avoid -ing"

