unit: 19
title: "Travel and Problems"
cefr_j: "B1.1"

can_do:
  - id: "B1.1-SI-17"
    ja: "旅行中に起こりうるトラブルについて、if を使って「もしこうなったら、こうする」という仮定の解決策を話すことができる"
  - id: "B1.1-SI-18"
    ja: "should have / should not have を使って、過去の旅行での失敗について後悔や軽い反省を伝えることができる"

