[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goon-corpus-backend"
version = "0.1.0"
description = "Research- and commercial-grade speech corpus collection backend"
readme = "README.md"
requires-python = ">=3.10"
# Core has ZERO runtime dependencies (standard library only).
dependencies = []

[project.optional-dependencies]
# Production ML capabilities — installed only when needed.
asr = ["faster-whisper>=1.0"]
fast = ["numpy>=1.24"]
dev = ["pytest>=7"]

[project.scripts]
goon-corpus = "corpus.cli:main"

[tool.setuptools.packages.find]
include = ["corpus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
