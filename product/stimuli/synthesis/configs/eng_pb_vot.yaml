# English /p/-/b/ VOT continuum
# Vowel: /ɑ/ (American English "bah" / "pah"), labial burst
# Reference: Lisker & Abramson (1964); English /p/ category boundary
# typically around +25 ms VOT

set_id: eng_pb_vot
set_name: "English /p/-/b/ VOT continuum"
language: en
contrast: "/p/-/b/"
vowel: "ɑ"

# 11-step continuum centered around the English boundary (~+25 ms)
vot_steps_ms: [-20, -10, 0, 10, 20, 30, 40, 50, 60, 75, 90]

# Vowel /ɑ/ formants (American English male-typical)
formants:
  f1: { freq: 730,  bw: 90 }
  f2: { freq: 1090, bw: 110 }
  f3: { freq: 2440, bw: 170 }
  f4: { freq: 3500, bw: 250 }

f0:
  start: 125
  end: 100

timing:
  lead_silence: 50
  closure: 60
  burst: 5
  vowel: 220
  trail_silence: 50

burst:
  type: labial
  intensity_db: 60   # labial bursts tend to be lower in amplitude

aspiration:
  intensity_db: 52   # English aspirated /p/ has stronger aspiration than Japanese /k/

voicing:
  intensity_db: 72
  prevoicing_intensity_db: 55

sample_rates_hz: [44100, 22050, 16000]
